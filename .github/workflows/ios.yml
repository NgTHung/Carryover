name: iOS unsigned IPA

on:
  push:
    # Documentation and task files cannot change the binary. Building them costs
    # macOS minutes that bill at ten times the Linux rate.
    paths-ignore:
      - '**.md'
      - '.tasks/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      development:
        description: 'Build a development client for Fast Refresh'
        type: boolean
        default: false
      widget:
        description: 'Build the release IPA with the widget extension'
        type: boolean
        default: false

# A second push supersedes the first. Without this, an abandoned run keeps a
# macOS runner busy for its full eight minutes.
concurrency:
  group: ios-${{ github.ref }}-${{ inputs.development && 'development' || 'release' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Expo Router generates route types from src/app; generate them before
      # typechecking so CI exercises the same typed links as local development.
      - run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'

  ipa:
    # macOS minutes bill at ten times the Linux rate, so never start a runner
    # for a tree that does not typecheck.
    needs: typecheck

    runs-on: macos-26
    env:
      BUILD_CONFIGURATION: ${{ inputs.development && 'Debug' || 'Release' }}
      CARRYOVER_VARIANT: ${{ inputs.development && 'development' || 'release' }}
      CARRYOVER_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      CARRYOVER_WIDGET: ${{ inputs.development && '0' || inputs.widget && '1' || '0' }}
      USE_CCACHE: '1'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # React Native's Swift packages need Swift tools 6.2, which ships with
      # Xcode 26. Select the newest Xcode the image has rather than trusting the
      # default, and record the versions so a toolchain regression is legible.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci

      - name: Prepare compiler cache
        id: compiler
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install ccache
          ccache --version
          TOOLCHAIN="$( { xcodebuild -version; ccache --version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$RUNNER_TEMP/carryover-ccache" >> "$GITHUB_ENV"
          echo "BUILD_REPORT_DIR=$RUNNER_TEMP/ios-build-report" >> "$GITHUB_ENV"

      # A unique save key lets each build add compiler results to the latest
      # compatible cache instead of freezing the first successful build.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.toolchain }}-${{ env.BUILD_CONFIGURATION }}-widget${{ env.CARRYOVER_WIDGET }}-${{ hashFiles('package-lock.json', 'app.config.js', 'plugins/**', 'scripts/patch-expo-widgets.mjs', 'scripts/build-ios.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.toolchain }}-${{ env.BUILD_CONFIGURATION }}-widget${{ env.CARRYOVER_WIDGET }}-${{ hashFiles('package-lock.json', 'app.config.js', 'plugins/**', 'scripts/patch-expo-widgets.mjs', 'scripts/build-ios.sh') }}-

      # The widget is deferred to build:WIDGET-002. Every push and development
      # build excludes it; dispatch a release build with the widget input to opt in.
      - name: Generate the native project
        run: npm run prebuild

      - name: Build unsigned
        id: build
        run: bash scripts/build-ios.sh

      - name: Report build performance
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        run: bash scripts/report-ios-build.sh

      - name: Upload build diagnostics
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-report-${{ env.CARRYOVER_VARIANT }}-widget${{ env.CARRYOVER_WIDGET }}
          path: ${{ env.BUILD_REPORT_DIR }}
          retention-days: 14
          if-no-files-found: error

      - name: Package .ipa
        run: |
          APP="$(find "ios/build/Build/Products/$BUILD_CONFIGURATION-iphoneos" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "No .app produced"; exit 1; }
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry carryover.ipa Payload

      # Records what actually reached the bundle, so a missing extension or a
      # stray entitlement is a build fact rather than a signing guess.
      - name: Report bundle contents
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY")
          echo "### Bundle"
          echo '```'
          find Payload -maxdepth 3 \( -name '*.app' -o -name '*.appex' \) \
            | sed 's|Payload/||' | sort
          echo '```'
          echo "Entitlements referenced in the build:"
          echo '```'
          find ios -name '*.entitlements' -exec echo '--- {}' \; -exec cat {} \; \
            2>/dev/null || echo "none found"
          echo '```'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.development && 'carryover-development-ipa' || 'carryover-ipa' }}
          path: carryover.ipa
          if-no-files-found: error

      - name: Generate signer source
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.widget
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/sideload-source.py --repository "$SOURCE_REPOSITORY" \
            --channel "$CARRYOVER_VARIANT" --build-number "$CARRYOVER_BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.widget
        with:
          name: sideload-source
          path: sideload/
          if-no-files-found: error

  publish:
    needs: ipa
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.widget
    runs-on: ubuntu-latest
    # Both variants update the same catalog, so publish one at a time.
    concurrency:
      group: sideload-source
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CARRYOVER_VARIANT: ${{ inputs.development && 'development' || 'release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.development && 'carryover-development-ipa' || 'carryover-ipa' }}
      - uses: actions/download-artifact@v4
        with:
          name: sideload-source
          path: sideload
      - name: Publish signer source
        run: bash scripts/publish-sideload.sh
