name: iOS unsigned IPA

on:
  push:
    # Documentation and task files cannot change the binary. Building them costs
    # macOS minutes that bill at ten times the Linux rate.
    paths-ignore:
      - '**.md'
      - '.tasks/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      widget:
        description: 'Build with the widget extension'
        type: boolean
        default: false

# A second push supersedes the first. Without this, an abandoned run keeps a
# macOS runner busy for its full eight minutes.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  ipa:
    # macOS minutes bill at ten times the Linux rate, so never start a runner
    # for a tree that does not typecheck.
    needs: typecheck

    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # React Native's Swift packages need Swift tools 6.2, which ships with
      # Xcode 26. Select the newest Xcode the image has rather than trusting the
      # default, and record the versions so a toolchain regression is legible.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci

      # The widget is deferred to build:WIDGET-002. Every push builds without the
      # extension; dispatch the workflow with the widget input to build one.
      - name: Generate the native project
        env:
          CARRYOVER_WIDGET: ${{ inputs.widget && '1' || '0' }}
        run: npm run prebuild

      - name: Install pods
        run: cd ios && pod install

      - name: Build unsigned
        run: |
          cd ios
          SCHEME="$(basename ./*.xcworkspace .xcworkspace)"
          echo "Building scheme: $SCHEME"
          xcodebuild \
            -workspace "$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "No .app produced"; exit 1; }
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry carryover.ipa Payload

      # Records what actually reached the bundle, so a missing extension or a
      # stray entitlement is a build fact rather than a signing guess.
      - name: Report bundle contents
        run: |
          exec > >(tee -a $GITHUB_STEP_SUMMARY)
          echo "### Bundle"
          echo '```'
          find Payload -maxdepth 3 \( -name '*.app' -o -name '*.appex' \) \
            | sed 's|Payload/||' | sort
          echo '```'
          echo "Entitlements referenced in the build:"
          echo '```'
          find ios -name '*.entitlements' -exec echo '--- {}' \; -exec cat {} \; \
            2>/dev/null || echo "none found"
          echo '```'

      - uses: actions/upload-artifact@v4
        with:
          name: carryover-ipa
          path: carryover.ipa
          if-no-files-found: error
